<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiberaMente APS</title>
    <meta name="description" content="Sito ufficiale di LiberaMente APS. Stiamo aggiornando i testi del sito, torneremo presto online.">
    <link rel="icon" type="image/jpeg" href="images/logo_aps.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #ebf1e8; /* Soft organic sage green */
            color: #23321e; /* Forest charcoal */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
            text-align: center;
        }

        .content {
            max-width: 480px;
            width: 100%;
        }

        .logo {
            width: 130px;
            height: 130px;
            object-fit: contain;
            background: #ffffff;
            padding: 8px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 4px 20px rgba(35, 50, 30, 0.04);
            border: 1px solid rgba(35, 50, 30, 0.05);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        h1 span {
            color: #3b7a57; /* Accent brand green */
            font-weight: 500;
        }

        .description {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4a5d45;
            margin-bottom: 48px;
        }

        .contact-section {
            border-top: 1px solid rgba(35, 50, 30, 0.08);
            border-bottom: 1px solid rgba(35, 50, 30, 0.08);
            padding: 32px 0;
            margin-bottom: 40px;
        }

        .contact-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 600;
            color: #687e62;
            margin-bottom: 20px;
        }

        .contact-link {
            display: block;
            font-size: 1.15rem;
            font-weight: 600;
            color: #23321e;
            text-decoration: none;
            margin: 10px 0;
            transition: color 0.2s ease;
        }

        .contact-link:hover {
            color: #3b7a57;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.9rem;
        }

        .social-links a {
            color: #687e62;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .social-links a:hover {
            color: #23321e;
        }

        .footer {
            margin-top: 48px;
            font-size: 0.8rem;
            color: #8fa08a;
        }

        .footer a {
            color: inherit;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="content">
        <img src="images/logo_aps.jpeg" alt="Logo LiberaMente APS" class="logo">
        
        <h1>LiberaMente <span>APS</span></h1>
        
        <p class="description">
            Stiamo aggiornando i testi e i contenuti del nostro portale. Torneremo presto online con la versione aggiornata del sito.
        </p>

        <div class="contact-section">
            <h2 class="contact-title">Contatti utili</h2>
            <a href="mailto:liberamentemagrin@gmail.com" class="contact-link">liberamentemagrin@gmail.com</a>
            <a href="tel:+393793330491" class="contact-link">379 3330491</a>
        </div>

        <div class="social-links">
            <a href="https://www.instagram.com/ass.liberamenteaps/" target="_blank" rel="noopener">Instagram</a>
            <span>/</span>
            <a href="https://www.facebook.com/share/1Efa2sazz6/" target="_blank" rel="noopener">Facebook</a>
            <span>/</span>
            <a href="https://www.tiktok.com/@ass.liberamenteaps" target="_blank" rel="noopener">TikTok</a>
        </div>

        <div class="footer">
            <p>&copy; 2026 LiberaMente APS. Codice Fiscale: 94055470044</p>
            <p style="margin-top: 6px;"><a href="privacy.html">Privacy Policy</a></p>
        </div>
    </div>
</body>
</html>
